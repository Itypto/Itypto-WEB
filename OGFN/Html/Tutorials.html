<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Itypto | Tutorials</title>
  <meta name="description" content="Tutorial hub for Itypto with tutorials loaded from a single JSON file." />
  <link rel="icon" href="../../Assets/WEB.ico" type="image/x-icon" />
  <script>
    (() => {
      const stylesheet = document.createElement("link");
      stylesheet.rel = "stylesheet";
      stylesheet.href = "../css/tutorials.css";
      document.head.appendChild(stylesheet);
    })();
  </script>
</head>

<body>
  <aside id="sidebar"></aside>
  <main id="main-content"></main>

  <script>
    (() => {
      const dataScript = document.createElement("script");
      dataScript.src = "../js/tutorials-data.js";
      document.body.appendChild(dataScript);

      const script = document.createElement("script");
      script.src = "../js/tutorials.js";
      document.body.appendChild(script);
    })();
  </script>
</body>

</html>
