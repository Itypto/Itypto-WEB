<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./main/html/home.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itypto | Redirecting</title>
    <meta name="description" content="Redirecting to the Itypto home page." />
    <style>
        :root {
            color-scheme: dark;
            --bg: #080b10;
            --panel: #111827;
            --text: #eef2ff;
            --muted: #a5b4fc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #1e293b, var(--bg) 60%);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid rgba(165, 180, 252, 0.3);
            border-radius: 18px;
            padding: 2rem 2.5rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.5);
        }

        a {
            color: var(--muted);
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Redirecting...</h1>
        <p>If you are not redirected automatically, <a href="./main/html/home.html">open the homepage</a>.</p>
    </div>
</body>

</html>
